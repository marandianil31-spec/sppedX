name: SpeedX APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Project
        run: |
          flutter create --platforms=android --org com.speedx build_app

      - name: Copy SpeedX Code
        run: |
          cp -r lib/. build_app/lib/

      - name: Add Dependencies
        working-directory: build_app
        run: |
          flutter pub add geolocator
          flutter pub add shared_preferences

      - name: Add GPS Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("build_app/android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permissions = """
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """

          if "android.permission.ACCESS_FINE_LOCATION" not in text:
              text = text.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

          p.write_text(text)
          PY

      - name: Build Release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload SpeedX APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedX-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
